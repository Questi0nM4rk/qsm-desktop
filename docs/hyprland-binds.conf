# qsm keybinds — the compositor half.
#
# The shell DECLARES its actions (shell/input/Shortcuts.qml) as Hyprland global
# shortcuts under the `qsm` appid, so a bind names an action instead of running
# a command: this file says which key, the shell says what it does. Nothing here
# spawns a process, and `hyprctl globalshortcuts` lists the live set with
# descriptions.
#
# Source from an hyprlang config:
#   source = ~/Projects/qsm-shell/docs/hyprland-binds.conf
#
# LUA-PARSER CONFIGS CANNOT SOURCE THIS FILE — the legacy `bind =` form is
# rejected outright. Use the dialect instead (the maintainer's own config, at
# ~/.config/hypr/hyprland.lua, is the worked example):
#
#   local function qsm(action) return hl.dsp.global("qsm:" .. action) end
#   hl.bind("SUPER + SPACE",       qsm("launcher"))
#   hl.bind("SUPER + V",           qsm("clipboard"))
#   hl.bind("SUPER + SLASH",       qsm("cheatsheet"))
#   hl.bind("SUPER + W",           qsm("workspaces"))
#   hl.bind("SUPER + SHIFT + B",   qsm("rail"))
#   hl.bind("SUPER + L",           qsm("lock"))
#   hl.bind("SUPER + F",           qsm("focusMode"))
#   hl.bind("CTRL + ALT + DELETE", qsm("session"))
#
# The cheat sheet reads `hyprctl binds -j` live, and every lua bind compiles to
# an opaque __lua handler — so give EVERY bind a description opt
# (`{ description = "..." }`) or it cannot appear on the sheet. Descriptions
# follow the "Group · Description" convention: the sheet splits on the first
# " · " and files the bind under that group header (no separator = "Other").

bind = SUPER, SPACE, global, qsm:launcher
bind = SUPER, A, global, qsm:quickControls
bind = SUPER, V, global, qsm:clipboard
bind = SUPER, SLASH, global, qsm:cheatsheet
bind = SUPER, W, global, qsm:workspaces
bind = SUPER SHIFT, B, global, qsm:rail
bind = SUPER, L, global, qsm:lock
bind = SUPER, F, global, qsm:focusMode
bind = CTRL ALT, DELETE, global, qsm:session

# Level controls go THROUGH the shell, not through wpctl/brightnessctl, so the
# OSD, the slider and the readout all follow from one event. brightnessctl
# writing sysfs behind the shell's back is exactly why the brightness keys used
# to move the screen with no OSD at all.
bindl  = , XF86AudioMute,          global, qsm:volumeMute
bindl  = , XF86AudioMicMute,       global, qsm:micMute
bindle = , XF86AudioRaiseVolume,   global, qsm:volumeUp
bindle = , XF86AudioLowerVolume,   global, qsm:volumeDown
bindle = , XF86MonBrightnessUp,    global, qsm:brightnessUp
bindle = , XF86MonBrightnessDown,  global, qsm:brightnessDown

# Media keys go the same way, for the same reason. The shell already decides
# WHICH player is active (playing > paused > first seen), so playerctl in the
# compositor config was a second, blind opinion about that — and it moved the
# track with no readout at all. The rail's media popout is what answers a media
# key, the way the OSD answers a level key.
bindl  = , XF86AudioPlay,          global, qsm:mediaToggle
bindl  = , XF86AudioPause,         global, qsm:mediaToggle
bindl  = , XF86AudioNext,          global, qsm:mediaNext
bindl  = , XF86AudioPrev,          global, qsm:mediaPrev

# NO standing blur rule here on purpose. The session backdrop surface is ALWAYS
# mapped (transparent when idle) and Hyprland blurs behind its region regardless
# of alpha, so a persistent `layerrule = blur, qsm-session-backdrop` blurs the
# whole desktop forever. The shell writes the rule at runtime, follows the modal,
# and asserts blur=false at startup so a rule left behind by a crash is cleared.
